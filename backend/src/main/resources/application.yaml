spring:
  application:
    name: beehub
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  web:
    error:
      include-stacktrace: never
      include-message: never

app:
  upload:
    dir: "./uploads/"

server:
  port: ${PORT:8080}
  servlet:
      session:
        cookie:
          same-site: none
          secure: true